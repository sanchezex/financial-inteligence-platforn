name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t future-backend:ci backend

      - name: Run tests inside Docker image
        run: |
          docker run --rm future-backend:ci sh -c "cd backend && PYTHONPATH=. pytest -q"
